services:
  middleware:
    build: .
    image: wialon-middleware:latest
    container_name: wialon-middleware
    restart: unless-stopped
    env_file: .env
    environment:
      BRIDGE_DB_PATH: /app/data/bridge.db
    ports:
      # only reachable from the VPS itself by default; set BIND_ADDRESS=0.0.0.0 in .env
      # to expose it (then API_KEY must be set)
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - bridge-data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # public reverse proxy for the Jimi webhook; enable with COMPOSE_PROFILES=proxy in .env.
  # It publishes ONE port (PROXY_PORT) and never uses the host's 80/443.
  proxy:
    image: caddy:2-alpine
    container_name: wialon-proxy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      middleware:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/${CADDY_CONFIG:-http}.Caddyfile", "--adapter", "caddyfile"]
    environment:
      PROXY_PORT: ${PROXY_PORT:-8090}
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-}
      CERT_NAME: ${CERT_NAME:-${WEBHOOK_DOMAIN:-}}
    ports:
      - "${PROXY_PORT:-8090}:${PROXY_PORT:-8090}"
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bridge-data:
  caddy-data:
  caddy-config:
