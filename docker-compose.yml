services:
  middleware:
    build: .
    image: wialon-middleware:latest
    container_name: wialon-middleware
    restart: unless-stopped
    env_file: .env
    environment:
      BRIDGE_DB_PATH: /app/data/bridge.db
    ports:
      # only reachable from the VPS itself by default; set BIND_ADDRESS=0.0.0.0 in .env
      # to expose it (then API_KEY must be set)
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - bridge-data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # public reverse proxy for the Jimi webhook; enable with COMPOSE_PROFILES=proxy in .env
  proxy:
    image: caddy:2-alpine
    container_name: wialon-proxy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      middleware:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bridge-data:
  caddy-data:
  caddy-config:
