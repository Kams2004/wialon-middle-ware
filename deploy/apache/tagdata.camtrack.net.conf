# Apache site for the Jimi Tag webhook: https://tagdata.camtrack.net/api/v1/tag/data/push
# A separate virtual host for this hostname only: no port changes, other sites untouched.
# Only the webhook and /health are forwarded to the middleware (127.0.0.1:8000);
# every other URL on this hostname is refused.
#
# Install (see README):
#   sudo a2enmod proxy proxy_http ssl
#   sudo cp deploy/apache/tagdata.camtrack.net.conf /etc/apache2/sites-available/
#   sudo a2ensite tagdata.camtrack.net && sudo apache2ctl configtest && sudo systemctl reload apache2

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName tagdata.camtrack.net

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/tagdata.camtrack.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tagdata.camtrack.net/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyTimeout 30
    ProxyPass        /api/v1/tag/data/push http://127.0.0.1:8000/api/v1/tag/data/push
    ProxyPassReverse /api/v1/tag/data/push http://127.0.0.1:8000/api/v1/tag/data/push
    ProxyPass        /health http://127.0.0.1:8000/health

    # deny everything on this hostname except the two forwarded paths
    <Location />
        Require all denied
    </Location>
    <Location /api/v1/tag/data/push>
        Require all granted
        LimitRequestBody 2097152
    </Location>
    <Location /health>
        Require all granted
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/tagdata-error.log
    CustomLog ${APACHE_LOG_DIR}/tagdata-access.log combined
</VirtualHost>
</IfModule>
