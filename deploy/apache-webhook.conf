# Jimi Tag webhook -> wialon-middleware (for VPSes where Apache already owns ports 80/443).
# Forwards ONLY the push path; every other URL keeps being served by the existing sites.
# Global config: inherited by all virtual hosts (ProxyPassInherit is on by default),
# so it works on the server IP and on any domain/HTTPS site Apache already serves.
#
# Install:
#   sudo a2enmod proxy proxy_http
#   sudo cp deploy/apache-webhook.conf /etc/apache2/conf-available/wialon-webhook.conf
#   sudo a2enconf wialon-webhook && sudo apache2ctl configtest && sudo systemctl reload apache2

<IfModule mod_proxy_http.c>
    # /api/v1/tag/data/push  or  /<WEBHOOK_TOKEN>/api/v1/tag/data/push
    ProxyPassMatch "^/([A-Za-z0-9_-]+/)?api/v1/tag/data/push/?$" "http://127.0.0.1:8000/$1api/v1/tag/data/push" timeout=30

    <LocationMatch "^/([A-Za-z0-9_-]+/)?api/v1/tag/data/push/?$">
        LimitRequestBody 2097152
        Require all granted
    </LocationMatch>
</IfModule>
